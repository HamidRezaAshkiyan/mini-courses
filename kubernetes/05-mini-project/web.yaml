apiVersion: v1
kind: ConfigMap
metadata:
  name: web-html
  namespace: k8s-mini-project
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <title>K8s Mini Project</title>
        <style>
          body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
          code { background: #f2f2f2; padding: 0.15rem 0.35rem; border-radius: 4px; }
        </style>
      </head>
      <body>
        <h1>Kubernetes Mini Project</h1>
        <p>This page is served by <code>nginx</code> from a <code>ConfigMap</code> inside the <code>k8s-mini-project</code> namespace.</p>
        <p>Redis is running internally at <code>redis:6379</code>.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-mini-project
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: html
          configMap:
            name: web-html
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: k8s-mini-project
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
